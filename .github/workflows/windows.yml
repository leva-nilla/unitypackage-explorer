name: Windows build and setup

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manually triggered setup build (x.y.z).'
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js for the local viewer build
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and test local lilToon viewer
        shell: pwsh
        run: |
          .\tools\release\Build-WebViewer.ps1 -Test
          $env:BROWSER_EXECUTABLE = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $env:BROWSER_EXECUTABLE)) { throw 'The runner Chrome installation is required for renderer regression tests.' }
          npm.cmd --prefix .\src\UnityPackageExplorer.App\WebViewer run test:render
          if ($LASTEXITCODE -ne 0) { throw 'The lilToon WebGL render regression failed.' }

      - name: Determine release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) {
            if ($env:REQUESTED_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw 'Manual setup version must use the x.y.z format.'
            }
            $version = $env:REQUESTED_VERSION
          } else {
            $version = '0.1.0'
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Test and build solution
        run: dotnet test .\UnityPackageExplorer.sln -c Release

      - name: Test legacy install migration safety
        shell: pwsh
        run: .\tests\PowerShell\Migrate-LegacyInstallFiles.Tests.ps1

      - name: Test legacy install removal safety
        shell: pwsh
        run: .\tests\PowerShell\LegacyInstallSafety.Tests.ps1

      - name: Test Explorer preview registration and restore
        shell: pwsh
        run: .\tests\PowerShell\ExplorerPreviewRegistration.Tests.ps1

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw 'Inno Setup compiler was not found after installation.'
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build self-contained x64 setup
        shell: pwsh
        run: .\tools\release\Build-Setup.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload setup and checksum
        uses: actions/upload-artifact@v4
        with:
          name: UnityPackageExplorer-Setup
          path: |
            .artifacts/release/v${{ steps.version.outputs.value }}/UnityPackageExplorer-Setup-${{ steps.version.outputs.value }}-x64.exe
            .artifacts/release/v${{ steps.version.outputs.value }}/UnityPackageExplorer-Setup-${{ steps.version.outputs.value }}-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

  installer-smoke:
    needs: windows-release
    runs-on: windows-2025
    steps:
      - name: Check out source for native COM harness
        uses: actions/checkout@v4

      - name: Install .NET 10 Desktop Runtime x64 for preview activation
        shell: pwsh
        run: |
          $runtimeInstaller = Join-Path $env:RUNNER_TEMP 'windowsdesktop-runtime-win-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/dotnet/10.0/windowsdesktop-runtime-win-x64.exe' -OutFile $runtimeInstaller
          $runtimeProcess = Start-Process -FilePath $runtimeInstaller -ArgumentList @('/install', '/quiet', '/norestart') -Wait -PassThru
          if ($runtimeProcess.ExitCode -notin @(0, 3010)) { throw "Desktop Runtime installer exited with code $($runtimeProcess.ExitCode)." }

      - name: Download setup artifact
        uses: actions/download-artifact@v4
        with:
          name: UnityPackageExplorer-Setup
          path: setup-artifact

      - name: Install, launch without .NET on PATH, validate Explorer commands, and uninstall
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.windows-release.outputs.version }}
        run: |
          $version = $env:PACKAGE_VERSION
          $setup = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'setup-artifact') -Filter "UnityPackageExplorer-Setup-$version-x64.exe" -File -Recurse | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE is missing from the downloaded artifact.' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'UnityPackageExplorer-IsolatedInstall'
          $setupArguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDirectory`"", '/TASKS=contextmenu,sendto,explorerpreview')
          $setupProcess = Start-Process -FilePath $setup.FullName -ArgumentList $setupArguments -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) { throw "Setup exited with code $($setupProcess.ExitCode)." }
          $previewBackup = Join-Path $env:LOCALAPPDATA 'UnityPackageExplorer\ExplorerPreviewRegistration.json'
          if (-not (Test-Path -LiteralPath $previewBackup)) { throw 'Preview registration backup was not written.' }
          $machinePreviewBackup = Join-Path $env:LOCALAPPDATA 'UnityPackageExplorer\ExplorerPreviewMachineRegistration.json'
          if (-not (Test-Path -LiteralPath $machinePreviewBackup)) { throw 'Machine preview registration backup was not written.' }
          $previewBackupCount = @((Get-Content -LiteralPath $previewBackup -Raw | ConvertFrom-Json).Values).Count
          $machinePreviewBackupCount = @((Get-Content -LiteralPath $machinePreviewBackup -Raw | ConvertFrom-Json).Values).Count
          $updateProcess = Start-Process -FilePath $setup.FullName -ArgumentList $setupArguments -Wait -PassThru
          if ($updateProcess.ExitCode -ne 0) { throw "Setup update exited with code $($updateProcess.ExitCode)." }
          if (@((Get-Content -LiteralPath $previewBackup -Raw | ConvertFrom-Json).Values).Count -ne $previewBackupCount) { throw 'Setup update replaced the original preview registration backup.' }
          if (@((Get-Content -LiteralPath $machinePreviewBackup -Raw | ConvertFrom-Json).Values).Count -ne $machinePreviewBackupCount) { throw 'Setup update replaced the original machine preview registration backup.' }

          $app = Join-Path $installDirectory 'UnityPackageExplorer.App.exe'
          $handler = Join-Path $installDirectory 'PreviewHandler\UnityPackageExplorer.PreviewHandler.comhost.dll'
          $uninstaller = Join-Path $installDirectory 'unins000.exe'
          $sendToDirectory = Join-Path $env:APPDATA 'Microsoft\Windows\SendTo'
          $sendToShortcut = Join-Path $sendToDirectory 'UnityPackage Explorer.lnk'
          $doubleExtensionShortcut = Join-Path $sendToDirectory 'UnityPackage Explorer.lnk.lnk'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw 'Installed application was not found.' }
          if (-not (Test-Path -LiteralPath $handler -PathType Leaf)) { throw 'Installed preview handler was not found.' }
          $handlerClsid = '{70C67CC6-949B-4B5D-A8F2-7844D5C29E76}'
          $registeredComhost = (Get-Item -LiteralPath "Registry::HKEY_LOCAL_MACHINE\Software\Classes\CLSID\$handlerClsid\InprocServer32" -ErrorAction Stop).GetValue('')
          if (-not [string]$registeredComhost -or -not ([string]$registeredComhost).Equals($handler, [StringComparison]::OrdinalIgnoreCase)) { throw 'Preview handler COM registration did not point to the installed comhost.' }
          $registeredAppId = (Get-Item -LiteralPath "Registry::HKEY_LOCAL_MACHINE\Software\Classes\CLSID\$handlerClsid" -ErrorAction Stop).GetValue('AppID')
          if ($registeredAppId -ne '{C50AF32D-4778-4B45-A2D3-FB0944F70271}') { throw 'Preview handler does not use its dedicated AppID.' }
          $surrogate = (Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\AppID\{C50AF32D-4778-4B45-A2D3-FB0944F70271}' -ErrorAction Stop).GetValue('DllSurrogate')
          if (-not ([string]$surrogate).EndsWith('System32\prevhost.exe', [StringComparison]::OrdinalIgnoreCase)) { throw 'Preview handler is not isolated in the system Preview Host.' }
          if ((Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\AppID\{C50AF32D-4778-4B45-A2D3-FB0944F70271}').GetValueNames().Contains('DisableLowILProcessIsolation')) { throw 'Preview handler registration disabled low-integrity isolation.' }
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Installed uninstaller was not found.' }
          if (-not (Test-Path -LiteralPath $sendToShortcut -PathType Leaf)) { throw "Expected Send To shortcut was not installed: $sendToShortcut" }
          if (Test-Path -LiteralPath $doubleExtensionShortcut) { throw "Send To shortcut has an unwanted double extension: $doubleExtensionShortcut" }
          $shortcutShell = New-Object -ComObject WScript.Shell
          $sendToTarget = [IO.Path]::GetFullPath($shortcutShell.CreateShortcut($sendToShortcut).TargetPath)
          if (-not $sendToTarget.Equals([IO.Path]::GetFullPath($app), [StringComparison]::OrdinalIgnoreCase)) {
            throw "Send To shortcut does not target the installed application: $sendToTarget"
          }

          $expectedCommand = '"{0}" "%1"' -f $app
          foreach ($extension in @('.unitypackage', '.prefab', '.zip', '.rar')) {
            $key = "Software\Classes\SystemFileAssociations\$extension\shell\UnityPackageExplorer.Open\command"
            $actualCommand = (Get-Item -LiteralPath "Registry::HKEY_CURRENT_USER\$key" -ErrorAction Stop).GetValue('')
            if ($actualCommand -ne $expectedCommand) { throw "Context menu command for $extension did not match the installed app." }
          }

          $ownedProgIdVerbPaths = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($extension in @('.unitypackage', '.prefab', '.zip', '.rar')) {
            $userChoicePath = "Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\$extension\UserChoice"
            $progId = $null
            if (Test-Path -LiteralPath $userChoicePath) {
              $userChoice = Get-ItemProperty -LiteralPath $userChoicePath -Name ProgId -ErrorAction SilentlyContinue
              if ($userChoice) { $progId = $userChoice.ProgId }
            }
            if (-not $progId) {
              $extensionKey = Get-Item -LiteralPath "Registry::HKEY_CLASSES_ROOT\$extension" -ErrorAction SilentlyContinue
              if ($extensionKey) { $progId = $extensionKey.GetValue('') }
            }
            if (-not $progId) { continue }
            if ($progId -notmatch '^[A-Za-z0-9._-]+(\\[A-Za-z0-9._-]+)*$' -or $progId.Split('\') -contains '.' -or $progId.Split('\') -contains '..') { throw "Unexpected ProgID for ${extension}: $progId" }
            $verbPath = "Registry::HKEY_CURRENT_USER\Software\Classes\$progId\shell\UnityPackageExplorer.Open"
            $commandPath = "$verbPath\command"
            $actualCommand = (Get-Item -LiteralPath $commandPath -ErrorAction Stop).GetValue('')
            if ($actualCommand -ne $expectedCommand) { throw "ProgID context menu command for $extension did not match the installed app." }
            [void]$ownedProgIdVerbPaths.Add($verbPath)
          }

          $fixtureDirectory = Join-Path $env:RUNNER_TEMP '日本語 fixture files'
          New-Item -ItemType Directory -Force -Path $fixtureDirectory | Out-Null
          $fixtures = @(
            (Join-Path $fixtureDirectory '素材 sample.unitypackage'),
            (Join-Path $fixtureDirectory 'Prefab sample.prefab'),
            (Join-Path $fixtureDirectory 'Archive sample.zip'),
            (Join-Path $fixtureDirectory 'Archive sample.rar')
          )
          Set-Content -LiteralPath $fixtures[0] -Value 'invalid test package' -Encoding UTF8
          Set-Content -LiteralPath $fixtures[1] -Value 'invalid test prefab' -Encoding UTF8
          $zipSource = Join-Path $fixtureDirectory 'zip-content.txt'
          Set-Content -LiteralPath $zipSource -Value 'fixture' -Encoding UTF8
          Compress-Archive -LiteralPath $zipSource -DestinationPath $fixtures[2] -Force
          Remove-Item -LiteralPath $zipSource -Force
          [IO.File]::WriteAllBytes($fixtures[3], [byte[]](0x52, 0x61, 0x72, 0x21, 0x1a, 0x07, 0x00))

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vcvars = & $vswhere -latest -products '*' -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars -or -not (Test-Path -LiteralPath $vcvars)) { throw 'The x64 Visual C++ build environment is required for COM activation smoke tests.' }
          $harnessSource = Join-Path $env:GITHUB_WORKSPACE 'tools\COMTestHarness\PreviewHandlerSmokeTest.cpp'
          $harnessExe = Join-Path $env:RUNNER_TEMP 'PreviewHandlerSmokeTest.exe'
          $buildCommand = 'call "{0}" >nul && cl.exe /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE "{1}" /Fe:"{2}" /link Ole32.lib OleAut32.lib Shlwapi.lib Shell32.lib User32.lib' -f $vcvars, $harnessSource, $harnessExe
          & $env:ComSpec /d /s /c $buildCommand
          if ($LASTEXITCODE -ne 0) { throw 'The native COM lifecycle smoke test harness did not compile.' }
          & $harnessExe $fixtures[2]
          if ($LASTEXITCODE -ne 0) { throw 'The Preview Handler COM activation/lifecycle smoke test failed.' }

          $childEnvironment = @{
            PATH = (Join-Path $env:SystemRoot 'System32')
            DOTNET_ROOT = ''
            DOTNET_ROOT_X64 = ''
            DOTNET_MULTILEVEL_LOOKUP = '0'
          }
          foreach ($fixture in $fixtures) {
            $process = Start-Process -FilePath $app -ArgumentList @("`"$fixture`"") -Environment $childEnvironment -PassThru
            try {
              Start-Sleep -Seconds 5
              $process.Refresh()
              if ($process.HasExited) { throw "App exited while opening '$fixture' with code $($process.ExitCode)." }
              if ($process.MainWindowHandle -eq [IntPtr]::Zero) { throw "App did not create a window for '$fixture'." }
            } finally {
              if (-not $process.HasExited -and -not $process.CloseMainWindow()) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
              if (-not $process.HasExited) { [void]$process.WaitForExit(5000) }
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            }
          }

          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstallProcess.ExitCode)." }
          if (Test-Path -LiteralPath $sendToShortcut) { throw 'Send To shortcut remained after uninstall.' }
          if (Test-Path -LiteralPath $doubleExtensionShortcut) { throw 'Double-extension Send To shortcut remained after uninstall.' }
          foreach ($extension in @('.unitypackage', '.prefab', '.zip', '.rar')) {
            $key = "Registry::HKEY_CURRENT_USER\Software\Classes\SystemFileAssociations\$extension\shell\UnityPackageExplorer.Open"
            if (Test-Path -LiteralPath $key) { throw "Context menu registration for $extension remained after uninstall." }
          }
          foreach ($verbPath in $ownedProgIdVerbPaths) {
            if (-not (Test-Path -LiteralPath $verbPath)) { continue }
            $verb = Get-Item -LiteralPath $verbPath
            $remainingLabel = [string]$verb.GetValue('')
            $remainingIcon = [string]$verb.GetValue('Icon')
            $commandPath = Join-Path $verbPath 'command'
            $remainingCommand = $null
            if (Test-Path -LiteralPath $commandPath) {
              $remainingCommand = [string](Get-Item -LiteralPath $commandPath).GetValue('')
            }
            if ($remainingCommand -eq $expectedCommand) { throw "An owned ProgID command still targets the uninstalled app: $verbPath" }
            if ($remainingLabel -eq 'UnityPackage Explorer で開く') { throw "An owned ProgID verb label remained after uninstall: $verbPath" }
            if ($remainingIcon -eq "$app,0" -or $remainingIcon -eq "`"$app`",0") { throw "An owned ProgID verb icon remained after uninstall: $verbPath" }
          }
          if (Test-Path -LiteralPath $installDirectory) { throw 'The isolated install directory remained after uninstall.' }
          $uninstalledClassPath = "Registry::HKEY_LOCAL_MACHINE\Software\Classes\CLSID\$handlerClsid"
          if (Test-Path -LiteralPath $uninstalledClassPath) {
            $uninstalledClass = Get-Item -LiteralPath $uninstalledClassPath
            if ($uninstalledClass.GetValueNames().Contains('AppID') -or $uninstalledClass.GetValueNames().Contains('')) { throw 'Owned Preview Handler CLSID values remained after uninstall.' }
          }
          $uninstalledInprocPath = "$uninstalledClassPath\InprocServer32"
          if ((Test-Path -LiteralPath $uninstalledInprocPath) -and (Get-Item -LiteralPath $uninstalledInprocPath).GetValueNames().Count -gt 0) { throw 'Owned Preview Handler InprocServer32 values remained after uninstall.' }
          $uninstalledAppIdPath = 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\AppID\{C50AF32D-4778-4B45-A2D3-FB0944F70271}'
          if ((Test-Path -LiteralPath $uninstalledAppIdPath) -and (Get-Item -LiteralPath $uninstalledAppIdPath).GetValueNames().Contains('DllSurrogate')) { throw 'Owned Preview Handler AppID values remained after uninstall.' }
          if (Test-Path -LiteralPath $machinePreviewBackup) { throw 'Machine preview registration backup remained after uninstall.' }
